<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>乐库优化方案预览（极简版）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  body { background: #f7f8fa; color: #1f2329; font-size: 14px; }

  /* ============ 预览工具栏（非产品界面） ============ */
  .preview-toolbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; gap: 6px; align-items: center;
    padding: 10px 16px; background: #1f2329;
    color: #fff; flex-wrap: wrap;
  }
  .preview-toolbar .label { font-size: 13px; color: #9aa0a6; margin-right: 4px; }
  .preview-toolbar button {
    background: transparent; color: #d4d6d9; border: 1px solid #3c4043;
    padding: 5px 14px; border-radius: 4px; cursor: pointer;
    font-size: 13px; transition: all .15s;
  }
  .preview-toolbar button:hover { background: #2d3136; color: #fff; }
  .preview-toolbar button.active { background: #fff; color: #1f2329; border-color: #fff; }
  .preview-toolbar .note { color: #6b7075; font-size: 12px; margin-left: auto; }

  /* ============ 产品外壳 ============ */
  .app-shell {
    max-width: 1000px; margin: 0 auto; background: #fff;
    min-height: 100vh; border-left: 1px solid #ebedf0; border-right: 1px solid #ebedf0;
  }
  .app-header {
    display: flex; align-items: center; gap: 32px;
    border-bottom: 1px solid #ebedf0;
    padding: 0 32px; height: 56px;
    position: sticky; top: 38px; z-index: 50; background: #fff;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: #1f2329; }
  .brand svg { color: #1f2329; }
  .nav { display: flex; gap: 4px; flex: 1; }
  .nav-item {
    padding: 6px 14px; cursor: pointer; border-radius: 4px;
    font-size: 14px; color: #4e5969; transition: background .15s, color .15s;
  }
  .nav-item:hover { background: #f2f3f5; color: #1f2329; }
  .nav-item.active { color: #1f2329; font-weight: 500; background: #f2f3f5; }
  .search-box {
    width: 220px; padding: 7px 12px;
    border: 1px solid #e5e6eb; border-radius: 4px;
    font-size: 13px; outline: none; background: #f7f8fa;
    transition: border-color .15s, background .15s;
  }
  .search-box:focus { border-color: #86909c; background: #fff; }

  .app-main { padding: 28px 32px 96px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ============ 模块标题 ============ */
  .module { margin-bottom: 32px; }
  .module-title {
    font-size: 15px; font-weight: 600; color: #1f2329;
    margin-bottom: 14px; display: flex; align-items: baseline; justify-content: space-between;
  }
  .module-title .more {
    font-size: 13px; color: #86909c; cursor: pointer; font-weight: 400;
    transition: color .15s;
  }
  .module-title .more:hover { color: #1f2329; }

  /* ============ 封面占位（纯色 + 首字，无渐变无 emoji） ============ */
  .cover-ph {
    background: #f2f3f5; color: #86909c;
    display: flex; align-items: center; justify-content: center;
    font-weight: 500; border-radius: 4px; flex-shrink: 0;
    overflow: hidden;
  }
  .cover-ph.sq { width: 48px; height: 48px; font-size: 16px; }
  .cover-ph.circle { border-radius: 50%; }
  .cover-ph.grid { width: 100%; aspect-ratio: 1; font-size: 28px; border-radius: 6px; }

  /* ============ 歌曲行 ============ */
  .song-row {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 12px; border-radius: 6px; cursor: pointer;
    transition: background .15s;
  }
  .song-row:hover { background: #f7f8fa; }
  .song-row.active { background: #f0f4ff; }
  .song-row .idx {
    width: 24px; text-align: center; flex-shrink: 0;
    font-size: 13px; color: #86909c; font-variant-numeric: tabular-nums;
  }
  .song-row .info { flex: 1; min-width: 0; }
  .song-row .t-row { display: flex; align-items: baseline; gap: 10px; }
  .song-row .t { font-size: 14px; color: #1f2329; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-row .dur { font-size: 12px; color: #a9aeb8; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .song-row .sub { font-size: 12px; color: #86909c; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-row .meta-col { font-size: 12px; color: #a9aeb8; flex-shrink: 0; text-align: right; line-height: 1.6; }

  /* ============ 网格（歌手/专辑） ============ */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: 20px 16px;
  }
  .grid-card { cursor: pointer; }
  .grid-card .cover-ph { transition: background .15s; }
  .grid-card:hover .cover-ph { background: #e8eaed; }
  .grid-name {
    font-size: 13px; color: #1f2329; margin-top: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .grid-sub { font-size: 12px; color: #a9aeb8; margin-top: 2px; }

  /* ============ 字母索引 ============ */
  .alpha-index {
    display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 20px;
  }
  .alpha-item {
    padding: 4px 10px; font-size: 13px; cursor: pointer;
    border-radius: 4px; color: #4e5969; transition: background .15s, color .15s;
    min-width: 30px; text-align: center;
  }
  .alpha-item:hover { background: #f2f3f5; color: #1f2329; }
  .alpha-item.active { background: #1f2329; color: #fff; }

  /* ============ Tab ============ */
  .tabs {
    display: flex; gap: 24px; border-bottom: 1px solid #ebedf0; margin-bottom: 20px;
  }
  .tab {
    padding: 10px 2px; cursor: pointer; font-size: 14px;
    color: #4e5969; border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: color .15s, border-color .15s;
  }
  .tab:hover { color: #1f2329; }
  .tab.active { color: #1f2329; font-weight: 500; border-bottom-color: #1f2329; }
  .tab .count { font-size: 12px; color: #a9aeb8; margin-left: 4px; }

  /* ============ 分页 ============ */
  .pagination {
    display: flex; justify-content: center; gap: 4px; margin-top: 32px;
  }
  .page-btn {
    padding: 6px 12px; border: 1px solid #e5e6eb; background: #fff;
    border-radius: 4px; cursor: pointer; font-size: 13px; color: #4e5969;
    transition: all .15s; min-width: 32px;
  }
  .page-btn:hover { border-color: #86909c; color: #1f2329; }
  .page-btn.active { background: #1f2329; color: #fff; border-color: #1f2329; }
  .page-btn.disabled { color: #c9cdd4; cursor: default; border-color: #ebedf0; }
  .page-btn.disabled:hover { border-color: #ebedf0; color: #c9cdd4; }

  /* ============ 详情页头部 ============ */
  .detail-header {
    display: flex; align-items: center; gap: 20px;
    padding-bottom: 24px; margin-bottom: 8px;
    border-bottom: 1px solid #ebedf0;
  }
  .detail-header .cover-ph { width: 96px; height: 96px; font-size: 34px; }
  .detail-header .cover-ph.circle { border-radius: 50%; }
  .detail-header h2 { font-size: 22px; font-weight: 600; color: #1f2329; margin-bottom: 8px; }
  .detail-header .stats { font-size: 13px; color: #86909c; }

  /* ============ 搜索高亮 ============ */
  .hl { color: #1f2329; font-weight: 600; }

  /* ============ 空状态（纯文字） ============ */
  .empty { text-align: center; color: #a9aeb8; padding: 80px 0; font-size: 14px; }

  /* ============ 底部播放条 ============ */
  .player-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 56px; background: #fff; border-top: 1px solid #ebedf0;
    display: flex; align-items: center; gap: 20px; padding: 0 24px;
    z-index: 100;
  }
  .pb-cover { width: 36px; height: 36px; border-radius: 4px; background: #f2f3f5; flex-shrink: 0; }
  .pb-info { flex: 1; min-width: 0; }
  .pb-title { font-size: 13px; color: #1f2329; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pb-artist { font-size: 12px; color: #86909c; margin-top: 1px; }
  .pb-ctrls { display: flex; align-items: center; gap: 20px; }
  .pb-ctrl { color: #4e5969; cursor: pointer; display: flex; transition: color .15s; }
  .pb-ctrl:hover { color: #1f2329; }
  .pb-progress { width: 120px; height: 3px; background: #ebedf0; border-radius: 2px; }
</style>
</head>
<body>

<div class="preview-toolbar">
  <span class="label">页面</span>
  <button class="active" data-page="home" onclick="switchPage('home')">首页</button>
  <button data-page="artists" onclick="switchPage('artists')">歌手</button>
  <button data-page="albums" onclick="switchPage('albums')">专辑</button>
  <button data-page="artist-detail" onclick="switchPage('artist-detail')">歌手详情</button>
  <button data-page="album-detail" onclick="switchPage('album-detail')">专辑详情</button>
  <button data-page="search" onclick="switchPage('search')">搜索结果</button>
  <span class="note">极简风格：无 emoji、无渐变、无重阴影，线性图标 + 细边框 + 背景色反馈</span>
</div>

<div class="app-shell">
  <div class="app-header">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      Music
    </div>
    <div class="nav">
      <div class="nav-item active" data-nav="home" onclick="switchPage('home')">首页</div>
      <div class="nav-item" data-nav="artists" onclick="switchPage('artists')">歌手</div>
      <div class="nav-item" data-nav="albums" onclick="switchPage('albums')">专辑</div>
    </div>
    <input class="search-box" placeholder="搜索歌曲、歌手、专辑" onfocus="switchPage('search')" />
  </div>

  <div class="app-main">

    <!-- 首页 -->
    <div class="page active" id="page-home">
      <div class="module">
        <div class="module-title">
          热门单曲
          <span class="more" onclick="switchPage('search')">查看全部</span>
        </div>
        <div id="hotList"></div>
      </div>

      <div class="module">
        <div class="module-title">
          最近上传
          <span class="more" onclick="switchPage('search')">查看全部</span>
        </div>
        <div id="recentList"></div>
      </div>
    </div>

    <!-- 歌手页 -->
    <div class="page" id="page-artists">
      <div class="module">
        <div class="module-title">全部歌手</div>
        <div class="alpha-index" id="alphaIndex"></div>
        <div class="grid" id="artistsGrid"></div>
        <div class="pagination">
          <span class="page-btn disabled">上一页</span>
          <span class="page-btn active">1</span>
          <span class="page-btn">2</span>
          <span class="page-btn">3</span>
          <span class="page-btn">下一页</span>
        </div>
      </div>
    </div>

    <!-- 专辑页 -->
    <div class="page" id="page-albums">
      <div class="module">
        <div class="module-title">全部专辑</div>
        <div class="grid" id="albumsGrid"></div>
        <div class="pagination">
          <span class="page-btn disabled">上一页</span>
          <span class="page-btn active">1</span>
          <span class="page-btn">2</span>
          <span class="page-btn">3</span>
          <span class="page-btn">下一页</span>
        </div>
      </div>
    </div>

    <!-- 歌手详情 -->
    <div class="page" id="page-artist-detail">
      <div class="detail-header">
        <div class="cover-ph circle">陈</div>
        <div>
          <h2>陈奕迅</h2>
          <div class="stats">12 首歌曲 · 4 张专辑 · 累计播放 1,234 次</div>
        </div>
      </div>
      <div class="module" style="margin-top: 20px;">
        <div id="artistSongs"></div>
      </div>
    </div>

    <!-- 专辑详情 -->
    <div class="page" id="page-album-detail">
      <div class="detail-header">
        <div class="cover-ph">U</div>
        <div>
          <h2>U-87</h2>
          <div class="stats">陈奕迅 · 2005 年 · 10 首歌曲</div>
        </div>
      </div>
      <div class="module" style="margin-top: 20px;">
        <div id="albumSongs"></div>
      </div>
    </div>

    <!-- 搜索结果 -->
    <div class="page" id="page-search">
      <div class="module">
        <div class="module-title" style="font-weight: 400; color: #4e5969;">
          搜索 “陈奕迅” 的结果
        </div>
        <div class="tabs">
          <div class="tab active" onclick="switchSearchTab('songs', this)">歌曲 <span class="count">3</span></div>
          <div class="tab" onclick="switchSearchTab('artists', this)">歌手 <span class="count">1</span></div>
          <div class="tab" onclick="switchSearchTab('albums', this)">专辑 <span class="count">2</span></div>
        </div>

        <div id="searchSongs"><div id="searchSongsList"></div></div>
        <div id="searchArtists" style="display:none;">
          <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); max-width: 300px;">
            <div class="grid-card" onclick="switchPage('artist-detail')">
              <div class="cover-ph circle grid">陈</div>
              <div class="grid-name">陈奕迅</div>
              <div class="grid-sub">12 首 · 1,234 次播放</div>
            </div>
          </div>
        </div>
        <div id="searchAlbums" style="display:none;">
          <div class="grid" id="searchAlbumsGrid" style="max-width: 320px;"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 底部播放条 -->
<div class="player-bar">
  <div class="pb-cover"></div>
  <div class="pb-info">
    <div class="pb-title">富士山下</div>
    <div class="pb-artist">陈奕迅 · U-87</div>
  </div>
  <div class="pb-ctrls">
    <span class="pb-ctrl"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 6h2v12H7zM20 6v12l-9-6z"/></svg></span>
    <span class="pb-ctrl"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></span>
    <span class="pb-ctrl"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15 6h2v12h-2zM4 6v12l9-6z"/></svg></span>
  </div>
  <div class="pb-progress"></div>
</div>

<script>
const songs = [
  { title: '富士山下', artist: '陈奕迅', album: 'U-87', duration: '04:28', plays: 156, date: '2026-09-08' },
  { title: '十年', artist: '陈奕迅', album: '黑白灰', duration: '03:25', plays: 142, date: '2026-09-07' },
  { title: '红玫瑰', artist: '陈奕迅', album: '认了吧', duration: '04:36', plays: 98, date: '2026-09-06' },
  { title: '稳稳的幸福', artist: '钟立风', album: '夏至', duration: '03:55', plays: 76, date: '2026-09-05' },
  { title: '夜空中最亮的星', artist: '逃跑计划', album: '世界', duration: '04:08', plays: 65, date: '2026-09-04' },
  { title: '南山南', artist: '马頔', album: '孤岛', duration: '05:25', plays: 54, date: '2026-09-03' },
  { title: '董小姐', artist: '宋冬野', album: '鸽子', duration: '04:12', plays: 43, date: '2026-09-02' },
  { title: '理想三旬', artist: '陈鸿宇', album: '一如年少模样', duration: '04:35', plays: 32, date: '2026-09-01' }
];

const artists = [
  { name: '陈奕迅', songs: 12, plays: '1,234' },
  { name: '逃跑计划', songs: 8, plays: '423' },
  { name: '宋冬野', songs: 6, plays: '312' },
  { name: '马頔', songs: 5, plays: '287' },
  { name: '钟立风', songs: 4, plays: '156' },
  { name: '陈鸿宇', songs: 3, plays: '98' },
  { name: '赵雷', songs: 4, plays: '76' },
  { name: '李志', songs: 7, plays: '65' },
  { name: '万能青年旅店', songs: 5, plays: '54' },
  { name: '朴树', songs: 3, plays: '43' },
  { name: '许巍', songs: 6, plays: '32' },
  { name: '花粥', songs: 2, plays: '21' }
];

const albums = [
  { name: 'U-87', artist: '陈奕迅', songs: 10 },
  { name: '黑白灰', artist: '陈奕迅', songs: 8 },
  { name: '世界', artist: '逃跑计划', songs: 6 },
  { name: '鸽子', artist: '宋冬野', songs: 5 },
  { name: '孤岛', artist: '马頔', songs: 4 },
  { name: '一如年少模样', artist: '陈鸿宇', songs: 3 },
  { name: '生如夏花', artist: '朴树', songs: 4 },
  { name: '此时此刻', artist: '许巍', songs: 6 }
];

// 歌曲行渲染：idx 为序号（可选），showMeta 显示右侧播放数/日期
function songRow(s, idx, showMeta) {
  const idxHtml = idx != null ? `<div class="idx">${idx}</div>` : '';
  const metaHtml = showMeta
    ? `<div class="meta-col">播放 ${s.plays} 次<br>${s.date}</div>`
    : '';
  return `
    <div class="song-row">
      ${idxHtml}
      <div class="cover-ph sq">${s.title.charAt(0)}</div>
      <div class="info">
        <div class="t-row"><span class="t">${s.title}</span><span class="dur">${s.duration}</span></div>
        <div class="sub">${s.artist} · ${s.album}</div>
      </div>
      ${metaHtml}
    </div>`;
}

function renderHot() {
  document.getElementById('hotList').innerHTML =
    songs.slice(0, 5).map((s, i) => songRow(s, i + 1)).join('');
}
function renderRecent() {
  document.getElementById('recentList').innerHTML =
    songs.map(s => songRow(s, null, true)).join('');
}
function renderArtists() {
  document.getElementById('artistsGrid').innerHTML = artists.map(a => `
    <div class="grid-card" onclick="switchPage('artist-detail')">
      <div class="cover-ph circle grid">${a.name.charAt(0)}</div>
      <div class="grid-name">${a.name}</div>
      <div class="grid-sub">${a.songs} 首 · ${a.plays} 次播放</div>
    </div>`).join('');
}
function renderAlbums() {
  document.getElementById('albumsGrid').innerHTML = albums.map(a => `
    <div class="grid-card" onclick="switchPage('album-detail')">
      <div class="cover-ph grid">${a.name.charAt(0)}</div>
      <div class="grid-name">${a.name}</div>
      <div class="grid-sub">${a.artist} · ${a.songs} 首</div>
    </div>`).join('');
}
function renderAlpha() {
  const letters = ['全部','A','B','C','D','E','F','G','H','J','L','M','P','Q','S','T','W','X','Y','Z','#'];
  document.getElementById('alphaIndex').innerHTML =
    letters.map((l, i) => `<span class="alpha-item ${i === 0 ? 'active' : ''}">${l}</span>`).join('');
}
function renderArtistSongs() {
  document.getElementById('artistSongs').innerHTML =
    songs.filter(s => s.artist === '陈奕迅').map((s, i) => songRow(s, i + 1)).join('');
}
function renderAlbumSongs() {
  document.getElementById('albumSongs').innerHTML =
    songs.filter(s => s.album === 'U-87').map((s, i) => songRow(s, i + 1)).join('');
}
function renderSearchSongs() {
  const kw = '陈奕迅';
  document.getElementById('searchSongsList').innerHTML =
    songs.filter(s => s.artist.includes(kw)).map(s => {
      const artist = s.artist.replace(kw, `<span class="hl">${kw}</span>`);
      return `
        <div class="song-row">
          <div class="cover-ph sq">${s.title.charAt(0)}</div>
          <div class="info">
            <div class="t-row"><span class="t">${s.title}</span><span class="dur">${s.duration}</span></div>
            <div class="sub">${artist} · ${s.album}</div>
          </div>
        </div>`;
    }).join('');
}
function renderSearchAlbums() {
  document.getElementById('searchAlbumsGrid').innerHTML =
    albums.filter(a => a.artist.includes('陈奕迅')).map(a => `
      <div class="grid-card" onclick="switchPage('album-detail')">
        <div class="cover-ph grid">${a.name.charAt(0)}</div>
        <div class="grid-name">${a.name}</div>
        <div class="grid-sub">${a.artist} · ${a.songs} 首</div>
      </div>`).join('');
}

function switchSearchTab(tab, el) {
  document.querySelectorAll('#page-search .tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('searchSongs').style.display = tab === 'songs' ? '' : 'none';
  document.getElementById('searchArtists').style.display = tab === 'artists' ? '' : 'none';
  document.getElementById('searchAlbums').style.display = tab === 'albums' ? '' : 'none';
}

function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navMap = { home: 'home', artists: 'artists', 'artist-detail': 'artists', albums: 'albums', 'album-detail': 'albums' };
  if (navMap[page]) document.querySelector(`.nav-item[data-nav="${navMap[page]}"]`).classList.add('active');
  document.querySelectorAll('.preview-toolbar button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.preview-toolbar button[data-page="${page}"]`).classList.add('active');
  window.scrollTo({ top: 0 });
}
