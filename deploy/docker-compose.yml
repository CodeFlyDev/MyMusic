services:

  mysql:
    image: mysql:8.0
    container_name: music-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-music_root_2024}
      MYSQL_DATABASE: music_db
      MYSQL_USER: music
      MYSQL_PASSWORD: ${DB_PASSWORD:-mymusic123}
      TZ: Asia/Shanghai
    # 1核1G 服务器内存调优：压低缓冲池、关闭性能Schema
    command:
      - --innodb_buffer_pool_size=64M
      - --key_buffer_size=8M
      - --max_connections=50
      - --performance-schema=off
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-music_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 400M

  backend:
    image: music-backend:1.0.0
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    container_name: music-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: music
      DB_PASSWORD: ${DB_PASSWORD:-mymusic123}
      UPLOAD_DIR: /data/uploads
      TZ: Asia/Shanghai
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M

  frontend:
    image: music-frontend:1.0.0
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    container_name: music-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 100M
