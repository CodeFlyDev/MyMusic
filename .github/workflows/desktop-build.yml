name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate icon
        run: npm run build:icon

      - name: Build exe
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-EXE
          path: |
            desktop/release/*.exe
