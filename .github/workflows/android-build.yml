name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 缓存签名 keystore，保证后续版本升级安装时签名一致
      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: keystore.jks
          key: mymusic-release-keystore-v1

      - name: Generate signing keystore
        if: steps.keystore.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -v -keystore keystore.jks
          -alias mymusic -keyalg RSA -keysize 2048 -validity 10000
          -storepass mymusic2024 -keypass mymusic2024
          -dname "CN=MyMusic, OU=Personal, O=MyMusic, C=CN"

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
        env:
          KS_PATH: ${{ github.workspace }}/keystore.jks
          KS_PASS: mymusic2024
          KS_ALIAS: mymusic

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-APK
          path: android/app/build/outputs/apk/release/*.apk
